<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✨ G3 Spelling Star Adventure</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 20px 10px;
}
.screen { display: none; width: 100%; max-width: 820px; }
.screen.active { display: block; }
.card { background: white; border-radius: 24px; padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
h1 { font-size: 2.2em; text-align: center; color: #5c35a0; margin-bottom: 8px; line-height: 1.3; }
h2 { font-size: 1.6em; text-align: center; color: #764ba2; margin-bottom: 14px; }
.btn { display: inline-block; padding: 12px 22px; border: none; border-radius: 50px; font-size: 1em; font-family: inherit; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; font-weight: bold; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
.btn-primary   { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
.btn-success   { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #155724; }
.btn-warning   { background: linear-gradient(135deg, #f7971e, #ffd200); color: #5c3d00; }
.btn-secondary { background: #e8e8e8; color: #555; }
.btn-info      { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #003c5c; }
.btn-reveal    { background: linear-gradient(135deg, #a18cd1, #fbc2eb); color: #3d0066; }
.list-tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; }
.tab { padding: 9px 24px; border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 1em; border: 2px solid #ccc; background: white; color: #555; font-weight: bold; transition: all 0.2s; }
.tab.active { background: #764ba2; color: white; border-color: #764ba2; }
.week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; }
.week-btn { padding: 14px 10px; background: linear-gradient(135deg, #e0f7fa, #e8f5e9); border: 2px solid #ccc; border-radius: 14px; cursor: pointer; text-align: center; transition: all 0.15s; font-family: inherit; font-size: 0.88em; font-weight: bold; color: #444; line-height: 1.4; }
.week-btn:hover { border-color: #764ba2; transform: scale(1.04); }
.week-btn.selected { border-color: #764ba2; background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.week-btn.all-btn { background: linear-gradient(135deg, #ffe0b2, #fff9c4); }
.week-btn.all-btn.selected { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
.btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.tile { display: inline-block; padding: 10px 16px; margin: 5px; border-radius: 12px; font-size: 1.35em; font-weight: bold; cursor: pointer; transition: transform 0.12s, opacity 0.12s; user-select: none; border: 3px solid transparent; letter-spacing: 0.5px; }
.tile:hover { transform: scale(1.1) translateY(-3px); }
.tile.t-r { background: #e3f2fd; color: #1565c0; border-color: #90caf9; }
.tile.t-p { background: #fff3e0; color: #bf360c; border-color: #ffcc80; }
.tile.t-s { background: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; }
.tile.t-c { background: #f3e5f5; color: #4a148c; border-color: #ce93d8; }
.tile.used { opacity: 0.25; cursor: default; transform: none !important; }
.tile.placed { opacity: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
.tile.placed:hover { transform: scale(1.05) translateY(-2px); }
.answer-zone { min-height: 78px; border: 3px dashed #bbb; border-radius: 16px; padding: 12px; margin: 14px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; background: #fafafa; transition: border-color 0.3s, background 0.3s; }
.answer-zone.correct { border-color: #43a047; background: #f1fff4; border-style: solid; }
.answer-zone.wrong   { border-color: #e53935; background: #fff5f5; border-style: solid; }
.scramble-zone { display: flex; flex-wrap: wrap; justify-content: center; padding: 12px 8px; min-height: 65px; background: #f5f5f5; border-radius: 14px; margin: 8px 0; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 10px 14px; background: linear-gradient(135deg, #fff9c4, #fffde7); border-radius: 12px; flex-wrap: wrap; gap: 8px; }
.progress-text { font-size: 1em; color: #555; font-weight: bold; }
.stars-display { font-size: 1.2em; }
.hint-card { border-radius: 16px; padding: 16px 20px; margin: 12px 0; font-size: 1.05em; line-height: 1.7; position: relative; }
.hint-card.example { background: #e8f4fd; border-left: 5px solid #2196f3; color: #0d3c61; }
.hint-card.definition { background: #fff8e1; border-left: 5px solid #ffc107; color: #4a3000; }
.hint-card .blank { display: inline-block; min-width: 90px; height: 26px; border-bottom: 3px solid #1565c0; vertical-align: bottom; margin: 0 4px; background: rgba(21,101,192,0.06); border-radius: 4px 4px 0 0; }
.hint-label { font-size: 0.75em; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; margin-bottom: 6px; }
.hint-toggle { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.htab { padding: 5px 14px; border-radius: 20px; border: 2px solid #bbb; background: white; color: #777; font-family: inherit; font-size: 0.85em; cursor: pointer; font-weight: bold; transition: all 0.15s; }
.htab.on { background: #764ba2; color: white; border-color: #764ba2; }
.reveal-area { text-align: center; margin: 6px 0; }
.revealed-word { display: inline-block; font-size: 2em; font-weight: bold; color: #3c1c7a; background: #f0ebff; padding: 6px 24px; border-radius: 12px; letter-spacing: 2px; border: 2px dashed #9575cd; }
.word-emoji { display: block; font-size: 4em; line-height: 1.2; animation: emojiBounce 0.6s ease; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); }
@keyframes emojiBounce { 0%{transform:scale(0) rotate(-10deg);opacity:0} 60%{transform:scale(1.3) rotate(5deg);opacity:1} 80%{transform:scale(0.9) rotate(-3deg)} 100%{transform:scale(1) rotate(0deg)} }
.feedback { text-align: center; font-size: 1.35em; font-weight: bold; min-height: 40px; padding: 8px; border-radius: 12px; margin: 8px 0; }
.feedback.ok  { color: #2e7d32; background: #c8e6c9; }
.feedback.err { color: #c62828; background: #ffcdd2; }
.info-box { border-radius: 12px; padding: 10px 16px; margin: 10px 0; font-size: 0.92em; color: #555; line-height: 1.6; }
.info-box.green { background: #e8f5e9; border-left: 4px solid #66bb6a; }
.legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 6px 0; font-size: 0.82em; }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 13px; height: 13px; border-radius: 4px; border: 2px solid; }
.study-card { background: linear-gradient(135deg, #f5f7fa, #dde3ef); border-radius: 20px; padding: 24px; text-align: center; margin: 12px 0; }
.study-word { font-size: 2.4em; font-weight: bold; color: #2c3e50; margin-bottom: 8px; letter-spacing: 1px; }
.study-dot  { font-size: 1.4em; color: #777; margin-bottom: 14px; letter-spacing: 3px; }
.results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 16px; max-height: 320px; overflow-y: auto; }
.result-item { padding: 9px 13px; border-radius: 10px; font-size: 0.9em; display: flex; align-items: center; gap: 7px; }
.result-item.ok-r  { background: #c8e6c9; }
.result-item.err-r { background: #ffcdd2; }
.score-bar-wrap { background: #eee; border-radius: 20px; height: 18px; margin: 12px 0; overflow: hidden; }
.score-bar { height: 100%; border-radius: 20px; background: linear-gradient(90deg, #43e97b, #38f9d7); transition: width 1s ease; }
@keyframes pop   { 0%{transform:scale(1)} 40%{transform:scale(1.15)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.pop   { animation: pop   0.4s ease; }
.shake { animation: shake 0.4s ease; }
.week-label { text-align: center; font-size: 0.85em; color: #999; margin-bottom: 4px; }
/* ── MILESTONE OVERLAY ── */
.milestone-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  animation: fadeInBg 0.3s ease;
}
@keyframes fadeInBg { from{opacity:0} to{opacity:1} }
.milestone-box {
  background: white; border-radius: 28px; padding: 36px 32px; text-align: center;
  max-width: 380px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  animation: popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes popIn { 0%{transform:scale(0.4) rotate(-8deg);opacity:0} 100%{transform:scale(1) rotate(0deg);opacity:1} }
.milestone-badge { font-size: 5em; line-height: 1.2; animation: badgeSpin 0.8s ease 0.2s both; }
@keyframes badgeSpin { 0%{transform:scale(0) rotate(-180deg);opacity:0} 70%{transform:scale(1.2) rotate(10deg)} 100%{transform:scale(1) rotate(0deg);opacity:1} }
.milestone-title { font-size: 1.8em; font-weight: bold; margin: 10px 0 6px; }
.milestone-sub   { font-size: 1em; color: #777; margin-bottom: 18px; line-height: 1.5; }
.milestone-stars-row { font-size: 1.4em; margin-bottom: 18px; letter-spacing: 2px; }
/* ── STAR COUNTER on welcome ── */
.star-counter-bar {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  background: linear-gradient(135deg, #fff9c4, #ffe0b2);
  border-radius: 16px; padding: 12px 20px; margin-bottom: 18px;
  border: 2px solid #ffd200;
}
.star-counter-num { font-size: 2em; font-weight: bold; color: #b8860b; }
.star-counter-label { font-size: 0.88em; color: #795548; line-height: 1.4; }
.milestone-progress {
  background: #f5f5f5; border-radius: 12px; padding: 10px 14px; margin-top: 10px;
  font-size: 0.85em; color: #666; line-height: 1.8;
}
.milestone-row { display: flex; align-items: center; gap: 8px; }
.milestone-done { color: #2e7d32; font-weight: bold; }
.milestone-lock { color: #bbb; }
/* ── confetti ── */
.confetti-piece {
  position: fixed; width: 10px; height: 10px; border-radius: 2px;
  animation: confettiFall linear forwards;
  pointer-events: none; z-index: 10000;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>

<div id="screen-welcome" class="screen active">
<div class="card">
  <div style="text-align:left;margin-bottom:10px">
    <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;padding:7px 16px;background:#e8e8e8;color:#555;border-radius:50px;font-weight:bold;font-size:0.88em;text-decoration:none;transition:background 0.15s" onmouseover="this.style.background='#d0d0d0'" onmouseout="this.style.background='#e8e8e8'">🏠 回首頁</a>
  </div>
  <h1>🌟 G3 Spelling Star<br>Adventure 🌟</h1>
  <div id="welcome-star-bar" class="star-counter-bar" style="display:none">
    <div style="font-size:2em">⭐</div>
    <div>
      <div class="star-counter-num" id="total-star-count">0</div>
      <div class="star-counter-label">累積星星 Lifetime Stars</div>
    </div>
    <div id="welcome-badge-display" style="font-size:1.8em"></div>
  </div>
  <div id="welcome-milestone-progress" class="milestone-progress" style="display:none"></div>
  <div class="list-tabs">
    <button class="tab active" id="tab-FET" onclick="selectList('FET')">📚 FET List</button>
    <button class="tab"        id="tab-CET" onclick="selectList('CET')">📖 CET List</button>
  </div>
  <div style="text-align:center;color:#666;font-size:0.95em;margin-bottom:8px">Choose weeks to practice (or pick All):</div>
  <div id="week-grid" class="week-grid"></div>
  <div class="btn-row" style="margin-top:22px">
    <button class="btn btn-success" onclick="startGame('study')">📖 Study First</button>
    <button class="btn btn-primary" onclick="startGame('practice')">🎮 Play Game!</button>
  </div>
</div>
</div>

<div id="screen-study" class="screen">
<div class="card">
  <div class="top-bar">
    <span class="progress-text" id="study-prog">1 / 10</span>
    <button class="btn btn-secondary" onclick="showScreen('welcome')" style="padding:7px 16px;font-size:0.88em">← Home</button>
  </div>
  <div id="study-content"></div>
  <div class="btn-row" style="margin-top:16px">
    <button class="btn btn-secondary" id="study-prev" onclick="studyNav(-1)">◀ Prev</button>
    <button class="btn btn-info"      onclick="startGame('practice')">🎮 Play Now!</button>
    <button class="btn btn-secondary" id="study-next" onclick="studyNav(1)">Next ▶</button>
  </div>
</div>
</div>

<div id="screen-practice" class="screen">
<div class="card">
  <div class="top-bar">
    <span class="progress-text" id="prac-prog">1 / 10</span>
    <span class="stars-display"  id="prac-stars">⭐ 0</span>
    <span id="prac-total-stars" style="font-size:0.88em;color:#888;font-weight:bold"></span>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="sound-toggle" onclick="toggleSound()" title="Sound ON (click to mute)"
        style="background:none;border:none;font-size:1.4em;cursor:pointer;padding:2px 6px;border-radius:8px;transition:background 0.2s"
        onmouseover="this.style.background='#eee'" onmouseout="this.style.background='none'">🔊</button>
      <button class="btn btn-secondary" onclick="showScreen('welcome')" style="padding:7px 16px;font-size:0.88em">← Exit</button>
    </div>
  </div>
  <div class="week-label" id="prac-week-label"></div>
  <div id="hint-card" class="hint-card example">
    <div class="hint-label" id="hint-label">Example Sentence</div>
    <div id="hint-text"></div>
    <div class="hint-toggle">
      <button class="htab on" id="htab-ex"  onclick="switchHint('ex')">📝 Example</button>
      <button class="htab"    id="htab-def" onclick="switchHint('def')">📖 Definition</button>
    </div>
  </div>
  <div class="reveal-area">
    <button class="btn btn-reveal" id="reveal-btn" onclick="revealWord()" style="font-size:0.9em;padding:8px 18px">
      👁 Show Word (uses 1 hint)
    </button>
    <div id="revealed-area" style="margin-top:8px"></div>
  </div>
  <div class="answer-zone" id="answer-zone">
    <span id="answer-placeholder" style="color:#ccc;font-size:0.95em">click syllables below to build the word →</span>
  </div>
  <div class="scramble-zone" id="scramble-zone"></div>
  <div class="feedback" id="prac-feedback"></div>
  <div class="btn-row">
    <button class="btn btn-warning"   id="hint-btn"  onclick="useHint()">💡 Hint (3)</button>
    <button class="btn btn-secondary"                onclick="clearAnswer()">🔄 Clear</button>
    <button class="btn btn-primary"   id="check-btn" onclick="checkAnswer()">✔ Check!</button>
    <button class="btn btn-success"   id="next-btn"  onclick="nextWord()" style="display:none">Next ▶</button>
  </div>
</div>
</div>

<div id="screen-results" class="screen">
<div class="card">
  <h2 id="results-title">🎉 Well Done! 🎉</h2>
  <div style="text-align:center;font-size:2em;margin:10px 0" id="results-emoji"></div>
  <div style="text-align:center;font-size:1.05em;color:#555;margin:6px 0" id="results-summary"></div>
  <div class="score-bar-wrap"><div class="score-bar" id="results-bar" style="width:0%"></div></div>
  <div id="results-total-stars" style="text-align:center;margin:10px 0;font-size:1em;color:#764ba2;font-weight:bold"></div>
  <div class="results-grid" id="results-grid"></div>
  <div class="btn-row" style="margin-top:22px">
    <button class="btn btn-primary" onclick="startGame('practice')">🔄 Play Again</button>
    <button class="btn btn-success" onclick="showScreen('welcome')">🏠 Home</button>
  </div>
</div>
</div>

<script>
// ── MILESTONE SYSTEM ──
const MILESTONES = [
  { at:10,  badge:"🥉", title:"Bronze Speller!",    sub:"你拿到了 10 顆星！太厲害了！",  color:"#cd7f32" },
  { at:30,  badge:"🥈", title:"Silver Champion!",   sub:"30 顆星！你是拼字達人！",       color:"#9e9e9e" },
  { at:50,  badge:"🥇", title:"Gold Master!",        sub:"50 顆星！傳說中的拼字王者！",   color:"#ffd700" },
];

function loadTotalStars() {
  try { return parseInt(localStorage.getItem('spellingStarsG3') || '0', 10); } catch(e) { return 0; }
}
function saveTotalStars(n) {
  try { localStorage.setItem('spellingStarsG3', String(n)); } catch(e) {}
}
function getUnlockedMilestones(n) {
  return MILESTONES.filter(m => n >= m.at);
}
function getHighestBadge(n) {
  const unlocked = getUnlockedMilestones(n);
  return unlocked.length ? unlocked[unlocked.length - 1] : null;
}
function updateWelcomeStarBar() {
  const n = loadTotalStars();
  const bar = document.getElementById('welcome-star-bar');
  const countEl = document.getElementById('total-star-count');
  const badgeEl = document.getElementById('welcome-badge-display');
  const progressEl = document.getElementById('welcome-milestone-progress');
  if (!bar) return;
  countEl.textContent = n;
  const badge = getHighestBadge(n);
  badgeEl.textContent = badge ? badge.badge : '';
  bar.style.display = 'flex';
  // milestone progress lines
  const lines = MILESTONES.map(m => {
    const done = n >= m.at;
    return `<div class="milestone-row">
      <span style="font-size:1.3em">${m.badge}</span>
      <span class="${done ? 'milestone-done' : 'milestone-lock'}">
        ${done ? '✅' : '🔒'} ${m.title} — ${m.at} ⭐
        ${done ? '' : `(還差 ${m.at - n} 顆)`}
      </span>
    </div>`;
  }).join('');
  progressEl.innerHTML = lines;
  progressEl.style.display = 'block';
}

function checkMilestones(oldTotal, newTotal) {
  const newly = MILESTONES.filter(m => newTotal >= m.at && oldTotal < m.at);
  if (!newly.length) return;
  setTimeout(() => showMilestone(newly[newly.length - 1]), 800);
}

function showMilestone(m) {
  spawnConfetti();
  const overlay = document.createElement('div');
  overlay.className = 'milestone-overlay';
  overlay.innerHTML = `
    <div class="milestone-box">
      <div class="milestone-badge">${m.badge}</div>
      <div class="milestone-title" style="color:${m.color}">${m.title}</div>
      <div class="milestone-sub">${m.sub}</div>
      <div class="milestone-stars-row">🌟🌟🌟🌟🌟</div>
      <button class="btn btn-primary" onclick="this.closest('.milestone-overlay').remove()" style="font-size:1.1em;padding:12px 32px">
        🎉 太棒了！
      </button>
    </div>`;
  document.body.appendChild(overlay);
}

function spawnConfetti() {
  const colors = ['#f5576c','#f093fb','#43e97b','#ffd200','#4facfe','#a18cd1','#ff9a9e'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${Math.random()*100}vw;
      top:-20px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*10}px;
      height:${6+Math.random()*10}px;
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*0.8}s;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}
// ── END MILESTONE SYSTEM ──

const TYPE_META = {
  r: { bg:"#e3f2fd", color:"#1565c0", border:"#90caf9", label:"syllable"  },
  p: { bg:"#fff3e0", color:"#bf360c", border:"#ffcc80", label:"prefix"    },
  s: { bg:"#e8f5e9", color:"#1b5e20", border:"#a5d6a7", label:"suffix"    },
  c: { bg:"#f3e5f5", color:"#4a148c", border:"#ce93d8", label:"word part" },
};

const WORD_DATA = {
  FET: {
    "W1": { title:"Why Sun & Moon · Week 1", words:[
      { w:"stream",    syl:["stream"],          t:["r"],         zh:"溪流",   emoji:"🏞️", ex:"We sat by the ___ and listened to the water.", def:"A small, narrow river." },
      { w:"friendly",  syl:["friend","ly"],     t:["r","s"],     zh:"友善的", emoji:"😊", ex:"Our new neighbor is very ___ and always waves hello.", def:"Kind, helpful, and easy to get along with." },
      { w:"thirsty",   syl:["thirs","ty"],      t:["r","s"],     zh:"口渴的", emoji:"💧", ex:"After running outside, I was very ___ for water.", def:"Feeling a need to drink something." },

// STATE

let currentList = 'FET';
let selectedWeeks = [];
let practiceWords = [];
let currentWordIdx = 0;
let tileBag = [];
let placed = [];
let stars = 0;
let hintsLeft = 3;
let wrongWords = [];
let answered = false;
let hintMode = 'ex';
let wordRevealed = false;
let studyWords = [];
let studyIdx = 0;

window.addEventListener('load', () => { selectList('FET'); updateWelcomeStarBar(); });

function selectList(list) {
  currentList = list;
  selectedWeeks = [];
  document.getElementById('tab-FET').classList.toggle('active', list === 'FET');
  document.getElementById('tab-CET').classList.toggle('active', list === 'CET');
  renderWeekGrid();
}

function renderWeekGrid() {
  const data = WORD_DATA[currentList];
  const keys = Object.keys(data);
  const grid = document.getElementById('week-grid');
  grid.innerHTML = '';
  const allSel = selectedWeeks.length === keys.length;
  const allBtn = mkEl('div', 'week-btn all-btn' + (allSel ? ' selected' : ''));
  const total = keys.reduce((s,k) => s + data[k].words.length, 0);
  allBtn.innerHTML = `🌟 All Weeks<br><small style="font-weight:normal">${total} words</small>`;
  allBtn.onclick = () => { selectedWeeks = allSel ? [] : [...keys]; renderWeekGrid(); };
  grid.appendChild(allBtn);
  keys.forEach(k => {
    const sel = selectedWeeks.includes(k);
    const btn = mkEl('div', 'week-btn' + (sel ? ' selected' : ''));
    btn.innerHTML = `<strong>${k}</strong><br><small style="font-weight:normal;font-size:0.82em">${data[k].title}</small><br><small>${data[k].words.length} words</small>`;
    btn.onclick = () => { selectedWeeks = sel ? selectedWeeks.filter(w => w !== k) : [...selectedWeeks, k]; renderWeekGrid(); };
    grid.appendChild(btn);
  });
}

function getActiveWords() {
  const data = WORD_DATA[currentList];
  const keys = selectedWeeks.length > 0 ? selectedWeeks : Object.keys(data);
  const result = [];
  keys.forEach(k => { if (data[k]) data[k].words.forEach(w => result.push({...w, weekKey:k, weekTitle:data[k].title})); });
  return result;
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (name === 'welcome') updateWelcomeStarBar();
}

function startGame(mode) {
  const words = getActiveWords();
  if (!words.length) { alert('Please select at least one week!'); return; }
  if (mode === 'study') {
    studyWords = words; studyIdx = 0; renderStudyWord(); showScreen('study');
  } else {
    practiceWords = shuffle([...words]); currentWordIdx = 0; stars = 0; hintsLeft = 3; wrongWords = [];
    renderPracticeWord(); showScreen('practice');
  }
}

const PREFIX_MEANINGS = {
  "re":"again → re + build = build <em>again</em>","un":"not / opposite → un + used = <em>not</em> used",
  "dis":"not / away → dis + appear = <em>not</em> appear","pre":"before → pre + pare = get ready <em>before</em>",
  "in":"not / into → in + hale = breathe <em>into</em>","im":"not / into → im + prove = move <em>into</em> better",
  "ex":"out / from → ex + claim = cry <em>out</em>","com":"together / with → com + municate = share <em>with</em> others",
  "con":"together / with → con + nect = join <em>together</em>","be":"make / around → be + come = <em>make</em> into",
  "de":"down / away → de + scribe = write <em>down</em>","en":"make / put into → en + ter = go <em>into</em>",
  "a":"to / at → a + gainst = placed <em>at</em> something","sur":"over / above → sur + face = <em>above</em> the surface",
  "mis":"wrong → mis + take = take the <em>wrong</em> way","pro":"forward / for → pro + tect = push <em>forward</em> to protect",
  "trans":"across → trans + port = carry <em>across</em>","bi":"two → bi + cycle = two wheels",
  "ob":"against / toward → ob + serve = look <em>toward</em>","af":"to / toward → af + fect = act <em>toward</em>",
  "an":"not / without → an + nounce = call <em>out</em>","al":"all / completely",
  "sup":"under / up → sup + pose = place <em>under</em>","mul":"many → mul + tiple = <em>many</em> times",
};
const SUFFIX_MEANINGS = {
  "ing":"-ing → action happening right now","ful":"-ful → full of (e.g. power<em>ful</em>)",
  "ly":"-ly → in a ___ way (e.g. slow<em>ly</em>)","tion":"-tion → the act or result of",
  "sion":"-sion → the act or result of","er":"-er → a person or thing that does something",
  "ness":"-ness → the state of being","able":"-able → able to be",
  "ble":"-ble → able to be","ment":"-ment → the result or process of",
  "ous":"-ous → full of / having the quality of","cious":"-cious → having the quality of",
  "y":"-y → having the quality of","ty":"-ty → state or quality",
  "dom":"-dom → the state of / a realm","al":"-al → relating to",
  "ed":"-ed → past tense / done","ence":"-ence → state or quality of",
  "some":"-some → tending to be / characterized by","less":"-less → without",
  "ship":"-ship → the state or condition of","ry":"-ry → relating to / place for",
  "age":"-age → action / result of","ize":"-ize → to make or become",
  "ist":"-ist → a person who does or believes","ry":"-ry → having the quality of",
  "al":"-al → relating to","ful":"-ful → full of",
};

function buildWordTip(w) {
  const tips = [];
  tips.push(`📖 <strong>${w.syl.length} syllable${w.syl.length>1?'s':''}</strong>: ${w.syl.join(' · ')}`);
  if (w.t.includes('p')) {
    w.syl.filter((_,i)=>w.t[i]==='p').forEach(pfx => {
      const m = PREFIX_MEANINGS[pfx.toLowerCase()];
      tips.push(`🟠 <strong>Prefix</strong> <span style="background:#fff3e0;color:#bf360c;border:1px solid #ffcc80;padding:2px 8px;border-radius:6px;font-weight:bold">${pfx}-</span>${m?` means: ${m.split('→')[0]}`:''}` + (m?`<br>&nbsp;&nbsp;&nbsp;💬 <em>${m}</em>`:''));
    });
  }
  if (w.t.includes('s')) {
    w.syl.filter((_,i)=>w.t[i]==='s').forEach(sfx => {
      const m = SUFFIX_MEANINGS[sfx.toLowerCase()];
      tips.push(`🟢 <strong>Suffix</strong> <span style="background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7;padding:2px 8px;border-radius:6px;font-weight:bold">-${sfx}</span>${m?` means: ${m.split('→')[0]}`:''}` + (m?`<br>&nbsp;&nbsp;&nbsp;💬 <em>${m}</em>`:''));
    });
  }
  if (w.t.includes('c')) {
    const parts = w.syl.filter((_,i)=>w.t[i]==='c');
    tips.push(`🟣 <strong>Compound word</strong>: ${parts.map(p=>`<span style="background:#f3e5f5;color:#4a148c;border:1px solid #ce93d8;padding:2px 8px;border-radius:6px;font-weight:bold">${p}</span>`).join(' + ')}<br>&nbsp;&nbsp;&nbsp;💬 Two or more words joined together to make a new meaning!`);
  }
  return tips.join('<br>');
}

function renderStudyWord() {
  const w = studyWords[studyIdx];
  document.getElementById('study-prog').textContent = `${studyIdx+1} / ${studyWords.length}`;
  document.getElementById('study-prev').disabled = studyIdx === 0;
  document.getElementById('study-next').disabled = studyIdx === studyWords.length - 1;
  const sylHTML = w.syl.map((s,i) => {
    const m = TYPE_META[w.t[i]] || TYPE_META.r;
    return `<span style="background:${m.bg};color:${m.color};border:2px solid ${m.border};padding:8px 15px;border-radius:10px;margin:4px;display:inline-block;font-size:1.3em;font-weight:bold">${s}</span>`;
  }).join('');
  const types = [...new Set(w.t)];
  let legendHTML = '';
  if (types.length > 1 || types[0] !== 'r') {
    legendHTML = '<div class="legend" style="margin-top:12px">' + types.map(tp => {
      const m = TYPE_META[tp] || TYPE_META.r;
      return `<div class="legend-item"><div class="legend-dot" style="background:${m.bg};border-color:${m.border}"></div><span style="color:${m.color};font-weight:bold">${m.label}</span></div>`;
    }).join('') + '</div>';
  }
  const exHTML = w.ex.replace('___', `<span style="display:inline-block;min-width:80px;border-bottom:3px solid #1565c0;color:#1565c0;font-weight:bold;text-align:center">${w.w}</span>`);
  document.getElementById('study-content').innerHTML = `
    <div class="study-card">
      <div style="font-size:0.82em;color:#999;margin-bottom:5px">${w.weekKey} · ${w.weekTitle}</div>
      <div class="study-word">${w.w}</div>
      <div style="font-size:1.8em;margin:4px 0">${w.emoji||''}</div>
      <div style="font-size:1em;color:#764ba2;font-weight:bold;margin-bottom:8px">${w.zh}</div>
      <div class="study-dot">${w.syl.join(' · ')}</div>
      <div>${sylHTML}</div>${legendHTML}
    </div>
    <div class="hint-card definition" style="margin-top:12px"><div class="hint-label">📖 Definition</div><div>${w.def}</div></div>
    <div class="hint-card example"><div class="hint-label">📝 Example Sentence</div><div>${exHTML}</div></div>
    <div class="info-box green" style="margin-top:8px">${buildWordTip(w)}</div>`;
}

function studyNav(dir) { studyIdx = Math.max(0, Math.min(studyWords.length-1, studyIdx+dir)); renderStudyWord(); }

function renderPracticeWord() {
  const w = practiceWords[currentWordIdx];
  answered = false; wordRevealed = false; hintMode = 'ex';
  document.getElementById('prac-prog').textContent = `${currentWordIdx+1} / ${practiceWords.length}`;
  document.getElementById('prac-stars').textContent = `⭐ ${stars}`;
  document.getElementById('prac-total-stars').textContent = `累積 ${loadTotalStars()}⭐`;
  document.getElementById('prac-week-label').textContent = `${w.weekKey} · ${w.weekTitle}`;
  document.getElementById('prac-feedback').textContent = '';
  document.getElementById('prac-feedback').className = 'feedback';
  document.getElementById('answer-zone').className = 'answer-zone';
  document.getElementById('check-btn').style.display = '';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('hint-btn').textContent = `💡 Hint (${hintsLeft})`;
  document.getElementById('hint-btn').disabled = hintsLeft === 0;
  document.getElementById('reveal-btn').style.display = '';
  document.getElementById('revealed-area').innerHTML = '';
  document.getElementById('hint-card').className = 'hint-card example';
  document.getElementById('hint-card').innerHTML = `
    <div class="hint-label" id="hint-label">📝 Example Sentence</div>
    <div id="hint-text"></div>
    <div class="hint-toggle">
      <button class="htab on" id="htab-ex"  onclick="switchHint('ex')">📝 Example</button>
      <button class="htab"    id="htab-def" onclick="switchHint('def')">📖 Definition</button>
    </div>`;
  renderHintCard();
  tileBag = shuffle(w.syl.map((s,i) => ({text:s, type:w.t[i], placed:false, origIdx:i})));
  placed = [];
  renderAnswerZone(); renderScrambleZone();
}

function renderHintCard() {
  const w = practiceWords[currentWordIdx];
  const card = document.getElementById('hint-card');
  const label = document.getElementById('hint-label');
  const text = document.getElementById('hint-text');
  if (hintMode === 'ex') {
    card.className = 'hint-card example'; label.textContent = '📝 Example Sentence';
    text.innerHTML = w.ex.replace('___', '<span class="blank"></span>');
  } else {
    card.className = 'hint-card definition'; label.textContent = '📖 Definition'; text.innerHTML = w.def;
  }
}

function switchHint(mode) {
  hintMode = mode;
  document.getElementById('htab-ex').classList.toggle('on', mode === 'ex');
  document.getElementById('htab-def').classList.toggle('on', mode === 'def');
  renderHintCard();
}

function revealWord() {
  if (wordRevealed || answered) return;
  if (hintsLeft <= 0) { document.getElementById('prac-feedback').textContent = '⚠️ No hints left!'; document.getElementById('prac-feedback').className = 'feedback err'; return; }
  hintsLeft--; wordRevealed = true;
  const w = practiceWords[currentWordIdx];
  document.getElementById('hint-btn').textContent = `💡 Hint (${hintsLeft})`;
  document.getElementById('hint-btn').disabled = hintsLeft === 0;
  document.getElementById('reveal-btn').style.display = 'none';
  document.getElementById('revealed-area').innerHTML = `<div class="revealed-word">🔍 ${w.w}</div>`;
  if (!wrongWords.includes(w.w)) wrongWords.push(w.w);
}

function renderScrambleZone() {
  const zone = document.getElementById('scramble-zone'); zone.innerHTML = '';
  tileBag.forEach((tile, idx) => {
    const m = TYPE_META[tile.type] || TYPE_META.r;
    const el = mkEl('div', 'tile t-' + tile.type + (tile.placed ? ' used' : ''));
    el.textContent = tile.text; el.style.background = m.bg; el.style.color = m.color; el.style.borderColor = m.border;
    if (!tile.placed) el.onclick = () => placeTile(idx);
    zone.appendChild(el);
  });
}

function renderAnswerZone() {
  const zone = document.getElementById('answer-zone');
  if (placed.length === 0) { zone.innerHTML = '<span style="color:#ccc;font-size:0.95em">click syllables below to build the word →</span>'; return; }
  zone.innerHTML = '';
  placed.forEach((tile, idx) => {
    const m = TYPE_META[tile.type] || TYPE_META.r;
    const el = mkEl('div', 'tile placed t-' + tile.type);
    el.textContent = tile.text; el.style.background = m.bg; el.style.color = m.color; el.style.borderColor = m.border;
    el.title = 'Click to remove'; el.onclick = () => removeTile(idx);
    zone.appendChild(el);
  });
}

function placeTile(bagIdx) {
  const tile = tileBag[bagIdx]; if (tile.placed) return;
  tile.placed = true; placed.push({text:tile.text, type:tile.type, bagIdx});
  sfxTileClick(); renderAnswerZone(); renderScrambleZone();
}

function removeTile(placedIdx) {
  if (answered) return;
  const tile = placed[placedIdx]; tileBag[tile.bagIdx].placed = false;
  placed.splice(placedIdx, 1); renderAnswerZone(); renderScrambleZone();
}

function clearAnswer() {
  if (answered) return; placed = []; tileBag.forEach(t => t.placed = false);
  renderAnswerZone(); renderScrambleZone();
}

function checkAnswer() {
  if (answered) return;
  const w = practiceWords[currentWordIdx];
  const correct = w.syl.join('');
  const attempt = placed.map(t => t.text).join('');
  if (!attempt) { document.getElementById('prac-feedback').textContent = '⚠️ Place some syllables first!'; document.getElementById('prac-feedback').className = 'feedback err'; return; }
  const zone = document.getElementById('answer-zone');
  if (attempt === correct) {
    answered = true; sfxCorrect(); speakWord(w.w, w.zh, 600);
    zone.className = 'answer-zone correct pop';
    document.getElementById('prac-feedback').textContent = '🎉 Correct! Awesome! ⭐';
    document.getElementById('prac-feedback').className = 'feedback ok';
    if (!wordRevealed) stars++;
    document.getElementById('prac-stars').textContent = `⭐ ${stars}`;
    document.getElementById('check-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = '';
    document.getElementById('hint-btn').disabled = true;
    document.getElementById('reveal-btn').style.display = 'none';
    const emojiHtml = w.emoji ? `<span class="word-emoji">${w.emoji}</span>` : '';
    document.getElementById('revealed-area').innerHTML = `${emojiHtml}<div class="revealed-word">✅ ${w.w}</div>`;
    const hc = document.getElementById('hint-card'); hc.className = 'info-box green'; hc.innerHTML = buildWordTip(w);
  } else {
    sfxWrong(); speakWord(w.w, w.zh, 500);
    zone.className = 'answer-zone wrong'; zone.classList.add('shake');
    setTimeout(() => zone.classList.remove('shake'), 500);
    document.getElementById('prac-feedback').textContent = '❌ Not quite! Try again 💪';
    document.getElementById('prac-feedback').className = 'feedback err';
    if (!wrongWords.includes(w.w)) wrongWords.push(w.w);
  }
}

function useHint() {
  if (hintsLeft <= 0 || answered) return;
  const w = practiceWords[currentWordIdx];
  const nextPos = placed.length; if (nextPos >= w.syl.length) return;
  const targetSyl = w.syl[nextPos];
  const bagIdx = tileBag.findIndex(t => !t.placed && t.text === targetSyl);
  if (bagIdx >= 0) { hintsLeft--; sfxHint(); placeTile(bagIdx); document.getElementById('hint-btn').textContent = `💡 Hint (${hintsLeft})`; document.getElementById('hint-btn').disabled = hintsLeft === 0; if (!wrongWords.includes(w.w)) wrongWords.push(w.w); }
}

function nextWord() { currentWordIdx++; if (currentWordIdx >= practiceWords.length) showResults(); else renderPracticeWord(); }

function showResults() {
  sfxCelebration();
  const total = practiceWords.length; const pct = Math.round(stars / total * 100);
  let title, emoji;
  if (pct >= 90) { title="🌟 Spelling Star! 🌟"; emoji="⭐⭐⭐"; }
  else if (pct >= 70) { title="🎉 Great Work! 🎉"; emoji="⭐⭐"; }
  else { title="💪 Keep Trying! 💪"; emoji="⭐"; }
  // Award 1 star only if entire session: all correct + zero hints/reveals
  const perfectRun = wrongWords.length === 0;
  const oldTotal = loadTotalStars();
  let newTotal = oldTotal;
  if (perfectRun) {
    newTotal = oldTotal + 1;
    saveTotalStars(newTotal);
    checkMilestones(oldTotal, newTotal);
  }
  const totalLifetime = newTotal;
  const badge = getHighestBadge(totalLifetime);
  document.getElementById('results-title').textContent = title;
  document.getElementById('results-emoji').textContent = emoji;
  document.getElementById('results-summary').textContent = `You got ${stars} out of ${total} correct! (${pct}%)`;
  const starEarned = perfectRun
    ? `🌟 完美通關！獲得 1 顆星！累積：⭐ ${totalLifetime} ${badge ? badge.badge : ''}`
    : `未達全對零提示，本局不計星。累積：⭐ ${totalLifetime} ${badge ? badge.badge : ''}`;
  document.getElementById('results-total-stars').innerHTML = starEarned;
  const bar = document.getElementById('results-bar'); bar.style.width = '0%'; setTimeout(() => bar.style.width = pct + '%', 100);
  const grid = document.getElementById('results-grid'); grid.innerHTML = '';
  practiceWords.forEach(w => {
    const wrong = wrongWords.includes(w.w);
    const el = mkEl('div', 'result-item ' + (wrong ? 'err-r' : 'ok-r'));
    el.innerHTML = `${wrong?'❌':'✅'} <strong>${w.w}</strong><span style="color:#666;font-size:0.82em;margin-left:4px">${w.syl.join('·')}</span>`;
    grid.appendChild(el);
  });
  showScreen('results');
}

let _audioCtx = null; let soundEnabled = true;
function getCtx() { if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (_audioCtx.state === 'suspended') _audioCtx.resume(); return _audioCtx; }
function playTone(freq, type, startTime, duration, vol = 0.28) { const ctx = getCtx(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type = type; osc.frequency.setValueAtTime(freq, startTime); gain.gain.setValueAtTime(vol, startTime); gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration); osc.start(startTime); osc.stop(startTime + duration + 0.05); }
function sfxTileClick() { if (!soundEnabled) return; const ctx = getCtx(); playTone(700,'sine',ctx.currentTime,0.07,0.18); }
function sfxCorrect() { if (!soundEnabled) return; const ctx = getCtx(); const t = ctx.currentTime; playTone(523,'triangle',t,0.18,0.30); playTone(659,'triangle',t+0.13,0.18,0.30); playTone(784,'triangle',t+0.26,0.30,0.35); playTone(1047,'triangle',t+0.39,0.30,0.25); }
function sfxWrong() { if (!soundEnabled) return; const ctx = getCtx(); const t = ctx.currentTime; playTone(220,'sawtooth',t,0.12,0.22); playTone(180,'sawtooth',t+0.14,0.18,0.18); }
function sfxHint() { if (!soundEnabled) return; const ctx = getCtx(); const t = ctx.currentTime; playTone(880,'sine',t,0.12,0.20); playTone(660,'sine',t+0.10,0.14,0.15); }
function sfxCelebration() { if (!soundEnabled) return; const ctx = getCtx(); const t = ctx.currentTime; [[523,'triangle',.30],[659,'triangle',.28],[784,'triangle',.28],[1047,'triangle',.32]].forEach(([f,tp,v],i) => playTone(f,tp,t+i*0.11,0.22,v)); [523,659,784,1047].forEach(f => playTone(f,'triangle',t+0.55,0.7,0.18)); }
function toggleSound() { soundEnabled = !soundEnabled; const btn = document.getElementById('sound-toggle'); btn.textContent = soundEnabled ? '🔊' : '🔇'; btn.title = soundEnabled ? 'Sound ON (click to mute)' : 'Sound OFF (click to unmute)'; }

let _cachedVoices = [];
if ('speechSynthesis' in window) { const _tryCache = () => { const v = window.speechSynthesis.getVoices(); if (v.length) _cachedVoices = v; }; _tryCache(); window.speechSynthesis.onvoiceschanged = _tryCache; }
function _pickEnVoice() { const voices = _cachedVoices.length ? _cachedVoices : window.speechSynthesis.getVoices(); return voices.find(v => v.lang === 'en-US' && /samantha|zira|susan|karen|victoria|serena|female|woman/i.test(v.name) && v.localService) || voices.find(v => v.lang === 'en-US' && v.localService) || voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en') && v.localService) || voices.find(v => v.lang.startsWith('en')) || null; }
function _pickZhVoice() { const voices = _cachedVoices.length ? _cachedVoices : window.speechSynthesis.getVoices(); return voices.find(v => v.lang === 'zh-TW' && v.localService) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh')) || null; }
function speakWord(word, zh, delayMs = 0) {
  if (!soundEnabled) return; if (!('speechSynthesis' in window)) return;
  setTimeout(() => {
    window.speechSynthesis.cancel();
    const uttEn = new SpeechSynthesisUtterance(word); uttEn.lang = 'en-US'; uttEn.rate = 0.85; uttEn.pitch = 1.1;
    const enVoice = _pickEnVoice(); if (enVoice) uttEn.voice = enVoice;
    window.speechSynthesis.speak(uttEn);
    if (zh) { const uttZh = new SpeechSynthesisUtterance(zh); uttZh.lang = 'zh-TW'; uttZh.rate = 0.9; uttZh.pitch = 1.1; const zhVoice = _pickZhVoice(); if (zhVoice) uttZh.voice = zhVoice; window.speechSynthesis.speak(uttZh); }
  }, delayMs);
}

function shuffle(arr) { for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function mkEl(tag, cls) { const el = document.createElement(tag); if (cls) el.className = cls; return el; }
</script>
