<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✨ Spelling Star Adventure</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px 10px;
}
.portal-card {
  background: white; border-radius: 28px; padding: 36px 28px;
  box-shadow: 0 16px 50px rgba(0,0,0,0.3);
  width: 100%; max-width: 540px; text-align: center;
}
h1 { font-size: 2.2em; color: #5c35a0; line-height: 1.3; margin-bottom: 6px; }
.subtitle { color: #888; font-size: 1em; margin-bottom: 30px; }

.grade-btn {
  display: flex; align-items: center; gap: 18px;
  width: 100%; padding: 20px 24px; margin-bottom: 16px;
  background: white; border: 3px solid #e0e0e0; border-radius: 20px;
  cursor: pointer; text-align: left; text-decoration: none;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  font-family: inherit;
}
.grade-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
.grade-btn.g2 { border-color: #90caf9; background: linear-gradient(135deg, #e3f2fd, #fce4ec); }
.grade-btn.g2:hover { border-color: #1565c0; }
.grade-btn.g3 { border-color: #a5d6a7; background: linear-gradient(135deg, #e8f5e9, #fff9c4); }
.grade-btn.g3:hover { border-color: #2e7d32; }

.grade-icon { font-size: 3.2em; line-height: 1; flex-shrink: 0; }
.grade-info { flex: 1; }
.grade-label { font-size: 1.5em; font-weight: bold; color: #333; margin-bottom: 4px; }
.grade-desc  { font-size: 0.88em; color: #777; line-height: 1.5; }
.grade-stars { font-size: 0.85em; color: #b8860b; font-weight: bold; margin-top: 6px; }
.grade-arrow { font-size: 1.5em; color: #bbb; flex-shrink: 0; }

.footer-note { margin-top: 22px; font-size: 0.82em; color: #aaa; }
.star-chip {
  display: inline-block; background: linear-gradient(135deg, #fff9c4, #ffe0b2);
  border: 1px solid #ffd200; border-radius: 20px; padding: 3px 12px;
  font-size: 0.85em; font-weight: bold; color: #b8860b;
  margin-top: 6px;
}

@keyframes floatStar {
  0%,100% { transform: translateY(0px) rotate(-5deg); }
  50%      { transform: translateY(-8px) rotate(5deg); }
}
.float { animation: floatStar 3s ease-in-out infinite; display: inline-block; }
</style>
</head>
<body>
<div class="portal-card">
  <div style="font-size:3.5em;margin-bottom:8px"><span class="float">⭐</span></div>
  <h1>Spelling Star<br>Adventure</h1>
  <p class="subtitle">康橋國際學校 · 選擇年級開始練習！</p>

  <a class="grade-btn g2" href="index-g2.html">
    <div class="grade-icon">📘</div>
    <div class="grade-info">
      <div class="grade-label">G2 · 國小二年級</div>
      <div class="grade-desc">FET &amp; CET 單字卡拼字練習<br>2025–2026 學年</div>
      <div class="grade-stars" id="g2-stars">⭐ 載入中…</div>
    </div>
    <div class="grade-arrow">▶</div>
  </a>

  <a class="grade-btn g3" href="index-g3.html">
    <div class="grade-icon">📗</div>
    <div class="grade-info">
      <div class="grade-label">G3 · 國小三年級</div>
      <div class="grade-desc">FET &amp; CET 單字卡拼字練習<br>2026–2027 學年</div>
      <div class="grade-stars" id="g3-stars">⭐ 載入中…</div>
    </div>
    <div class="grade-arrow">▶</div>
  </a>

  <div class="footer-note">
    每場全對且不靠提示 → 累積 1 顆星 🌟<br>
    🥉 10顆 · 🥈 30顆 · 🥇 50顆 解鎖勳章
  </div>
</div>

<script>
const MILESTONES = [
  { at:10, badge:"🥉" },
  { at:30, badge:"🥈" },
  { at:50, badge:"🥇" },
];
function getStars(key) {
  try { return parseInt(localStorage.getItem(key) || '0', 10); } catch(e) { return 0; }
}
function getBadge(n) {
  const u = MILESTONES.filter(m => n >= m.at);
  return u.length ? u[u.length-1].badge : '';
}
function renderStars() {
  const g2 = getStars('spellingStarsG2');
  const g3 = getStars('spellingStarsG3');
  document.getElementById('g2-stars').textContent = `⭐ 累積 ${g2} 顆星 ${getBadge(g2)}`;
  document.getElementById('g3-stars').textContent = `⭐ 累積 ${g3} 顆星 ${getBadge(g3)}`;
}
renderStars();
</script>
</body>
</html>
